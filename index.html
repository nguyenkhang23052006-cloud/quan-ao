<body>

<header>

    <div class="logo">
        DESIGNWEAR
    </div>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#designer">Thiết kế</a>
        <a href="#contact">Liên hệ</a>
    </nav>

</header>


<section class="hero">

    <h1>Tự Thiết Kế Áo 3D</h1>

    <p>
        Upload hình ảnh, thêm chữ và xoay áo 360° để xem thiết kế.
    </p>

</section>


<section class="designer" id="designer">

    <h2>🎨 Trình thiết kế áo</h2>

    <div class="designer-box">


        <!-- =====================
             3D VIEWER
        ====================== -->

        <div class="viewer">

            <canvas id="canvas3d"></canvas>

            <div class="view-buttons">

                <button onclick="frontView()">
                    Mặt trước
                </button>

                <button onclick="backView()">
                    Mặt sau
                </button>

                <button onclick="resetView()">
                    Xoay lại
                </button>

            </div>

            <div class="viewer-info">
                🖱️ Kéo chuột để xoay áo
            </div>

        </div>


        <!-- =====================
             CONTROL PANEL
        ====================== -->

        <div class="controls">


            <!-- MÀU ÁO -->

            <div class="group">

                <label>
                    🎨 Màu áo
                </label>

                <div class="colors">

                    <div
                        class="color"
                        style="background:#ffffff"
                        onclick="changeShirtColor('#ffffff')">
                    </div>

                    <div
                        class="color"
                        style="background:#000000"
                        onclick="changeShirtColor('#000000')">
                    </div>

                    <div
                        class="color"
                        style="background:#ff4d6d"
                        onclick="changeShirtColor('#ff4d6d')">
                    </div>

                    <div
                        class="color"
                        style="background:#4dabf7"
                        onclick="changeShirtColor('#4dabf7')">
                    </div>

                    <div
                        class="color"
                        style="background:#51cf66"
                        onclick="changeShirtColor('#51cf66')">
                    </div>

                    <div
                        class="color"
                        style="background:#ffd43b"
                        onclick="changeShirtColor('#ffd43b')">
                    </div>

                </div>

            </div>


            <!-- UPLOAD ẢNH -->

            <div class="group">

                <label>
                    🖼️ Thêm hình ảnh
                </label>

                <input
                    type="file"
                    id="imageUpload"
                    accept="image/*">

                <button
                    class="remove-image"
                    onclick="removeImage()">

                    Xóa hình ảnh

                </button>

            </div>


            <!-- THÊM CHỮ -->

            <div class="group">

                <label>
                    ✏️ Nội dung chữ
                </label>

                <input
                    type="text"
                    id="textInput"
                    placeholder="Nhập chữ muốn in trên áo">

            </div>


            <!-- MÀU CHỮ -->

            <div class="group">

                <label>
                    Màu chữ
                </label>

                <input
                    type="color"
                    id="textColor"
                    value="#000000">

            </div>


            <!-- SIZE -->

            <div class="group">

                <label>
                    📏 Chọn size
                </label>

                <div class="sizes">

                    <button
                        class="size"
                        onclick="selectSize(this)">
                        S
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)">
                        M
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)">
                        L
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)">
                        XL
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)">
                        XXL
                    </button>

                </div>

            </div>

            </div>

                199.000đ
            </div>

                class="cart-btn"
                onclick="addCart()">

                🛒 Thêm vào giỏ hàng

            </button>

        </div>

    </div>

</section>


<footer id="contact">

    © 2026 DESIGNWEAR - Custom Clothing

</footer>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>


<script>

    /* =========================
       THREE.JS
    ========================= */

    const canvas =
        document.getElementById("canvas3d");

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0xe9e9e9);


    const camera =
        new THREE.PerspectiveCamera(
            45,
            canvas.clientWidth / canvas.clientHeight,
            0.1,
            100
        );

    camera.position.set(
        0,
        1,
        5
    );


    const renderer =
        new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true
        });

    renderer.setPixelRatio(
        window.devicePixelRatio
    );

    renderer.setSize(
        canvas.clientWidth,
        canvas.clientHeight
    );


    /* LIGHT */

    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            2
        );

    scene.add(ambientLight);


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directionalLight.position.set(
        3,
        5,
        5
    );

    scene.add(directionalLight);


    /* =========================
       ÁO 3D
    ========================= */

    const shirtGroup =
        new THREE.Group();

    scene.add(shirtGroup);


    /*
       Thân áo
    */

    const bodyGeometry =
        new THREE.BoxGeometry(
            2.5,
            3,
            0.45
        );

    const shirtMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.8
        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            shirtMaterial
        );

    body.position.y = 0;

    shirtGroup.add(body);


    /*
       Tay áo trái
    */

    const sleeveGeometry =
        new THREE.BoxGeometry(
            1.2,
            1.6,
            0.45
        );


    const leftSleeve =
        new THREE.Mesh(
            sleeveGeometry,
            shirtMaterial
        );

    leftSleeve.position.set(
        -1.65,
        0.55,
        0
    );

    leftSleeve.rotation.z =
        -0.35;

    shirtGroup.add(leftSleeve);


    /*
       Tay áo phải
    */

    const rightSleeve =
        new THREE.Mesh(
            sleeveGeometry,
            shirtMaterial
        );

    rightSleeve.position.set(
        1.65,
        0.55,
        0
    );

    rightSleeve.rotation.z =
        0.35;

    shirtGroup.add(rightSleeve);


    /* =========================
       CỔ ÁO
    ========================= */

    const collarGeometry =
        new THREE.TorusGeometry(
            0.38,
            0.08,
            16,
            32
        );

    const collar =
        new THREE.Mesh(
            collarGeometry,
            new THREE.MeshStandardMaterial({
                color: 0xdddddd
            })
        );

    collar.rotation.x =
        Math.PI / 2;

    collar.position.y =
        1.2;

    collar.position.z =
        0.25;

    shirtGroup.add(collar);


    /* =========================
       ORBIT CONTROLS
    ========================= */

    const controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.enablePan = false;

    controls.minDistance = 3;

    controls.maxDistance = 8;


    /* =========================
       TEXTURE
    ========================= */

    let designTexture = null;


    function createDesignTexture() {

        const canvas2 =
            document.createElement("canvas");

        canvas2.width = 1024;
        canvas2.height = 1024;

        const ctx =
            canvas2.getContext("2d");

        ctx.clearRect(
            0,
            0,
            1024,
            1024
        );

        /*
           ẢNH
        */

        if (designTexture) {

            const image =
                designTexture.image;

            ctx.drawImage(
                image,
                260,
                300,
                500,
                400
            );

        }


        /*
           CHỮ
        */

        const text =
            document.getElementById(
                "textInput"
            ).value;

        if (text) {

            ctx.font =
                "bold 90px Arial";

            ctx.textAlign =
                "center";

            ctx.fillStyle =
                document.getElementById(
                    "textColor"
                ).value;

            ctx.fillText(
                text,
                512,
                820
            );

        }


        const texture =
            new THREE.CanvasTexture(
                canvas2
            );

        texture.colorSpace =
            THREE.SRGBColorSpace;

        return texture;

    }


    function updateDesign() {

        const texture =
            createDesignTexture();

        body.material.map =
            texture;

        body.material.needsUpdate =
            true;

    }


    /* =========================
       UPLOAD ẢNH
    ========================= */

    document
        .getElementById("imageUpload")
        .addEventListener(
            "change",
            function(event) {

                const file =
                    event.target.files[0];

                if (!file) return;


                const reader =
                    new FileReader();

                reader.onload =
                    function(e) {

                        const loader =
                            new THREE.TextureLoader();

                        loader.load(
                            e.target.result,
                            function(texture) {

                                texture.colorSpace =
                                    THREE.SRGBColorSpace;

                                designTexture =
                                    texture;

                                updateDesign();

                            }
                        );

                    };

                reader.readAsDataURL(file);

            }
        );


    /* =========================
       CHỮ
    ========================= */

    document
        .getElementById("textInput")
        .addEventListener(
            "input",
            updateDesign
        );


    document
        .getElementById("textColor")
        .addEventListener(
            "input",
            updateDesign
        );


    /* =========================
       ĐỔI MÀU ÁO
    ========================= */

    function changeShirtColor(color) {

        shirtMaterial.color.set(color);

    }


    /* =========================
       XÓA ẢNH
    ========================= */

    function removeImage() {

        designTexture = null;

        document
            .getElementById("imageUpload")
            .value = "";

        updateDesign();

    }


    /* =========================
       GÓC NHÌN
    ========================= */

    function frontView() {

        shirtGroup.rotation.y =
            0;

    }


    function backView() {

        shirtGroup.rotation.y =
            Math.PI;

    }


    function resetView() {

        shirtGroup.rotation.y =
            0;

        camera.position.set(
            0,
            1,
            5
        );

    }


    /* =========================
       SIZE
    ========================= */

    function selectSize(button) {

        document
            .querySelectorAll(".size")
            .forEach(
                function(btn) {

                    btn.classList.remove(
                        "active"
                    );

                }
            );

        button.classList.add(
            "active"
        );

    }


    /* =========================
       GIỎ HÀNG
    ========================= */

    function addCart() {

        const name =
            document.getElementById(
                "customerName"
            ).value;

        const size =
            document.querySelector(
                ".size.active"
            );


        if (!name) {

            alert(
                "Vui lòng nhập tên khách hàng!"
            );

            return;

        }


        if (!size) {

            alert(
                "Vui lòng chọn size!"
            );

            return;

        }


        alert(
            "Đã thêm sản phẩm vào giỏ hàng!\n\n" +
            "Khách hàng: " + name +
            "\nSize: " + size.innerText +
            "\nGiá: 199.000đ"
        );

    }


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
        "resize",
        function() {

            camera.aspect =
                canvas.clientWidth /
                canvas.clientHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                canvas.clientWidth,
                canvas.clientHeight
            );

        }
    );


    /* =========================
       ANIMATION
    ========================= */

    function animate() {

        requestAnimationFrame(
            animate
        );

        controls.update();

        renderer.render(
            scene,
            camera
        );

    }

    animate();

</script>

</body>
</html>
